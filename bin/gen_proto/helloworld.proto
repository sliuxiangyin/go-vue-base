syntax = "proto3";
// ✅ 告诉 Go 插件生成文件属于哪个包
option go_package = "app/protos;protos";
package helloworld;

// 定义服务
service Greeter {
  // 定义 RPC 方法
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// 定义请求消息
message HelloRequest {
  string name = 1;
}

// 定义响应消息
message HelloReply {
  string message = 1;
}
